<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM77 Website</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- خلفية النجوم -->
  <div id="particles-js"></div>

  <!-- الهيدر -->
  <header>
    <h2 class="logo">RM7</h2>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- البطل -->
  <section id="home" class="hero">
    <h1 class="title">Welcome to <span>RM7</span> Universe</h1>
    <p class="subtitle">Innovation. Style. Power.</p>
    <a href="#contact" class="btn">Get in Touch</a>
  </section>

  <!-- السوشيال ميديا -->
  <section class="socials">
    <h2>Follow Me</h2>
    <div class="icons">
      <a href="https://instagram.com/rm7.rayane" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/rm7_rayane" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://snapchat.com/add/rm7.mxh" target="_blank"><i class="fab fa-snapchat"></i></a>
      <a href="https://youtube.com/@RM7-LIVE" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
  </section>

  <!-- تواصل -->
  <section id="contact" class="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <!-- الفوتر -->
  <footer>
    <p>© 2025 RM7 Website | Designed with 💜</p>
  </footer>

  <!-- مكتبة particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
